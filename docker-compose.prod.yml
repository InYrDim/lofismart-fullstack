services:
  mysql:
    image: mysql:8.0
    container_name: lofishmart_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
      - MYSQL_DATABASE=${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lofishmart_phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
    ports:
      - "8080:80"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./lofishmart-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:${BACKEND_PORT}/api
        - VITE_WEBSOCKET_URL=ws://localhost:${BACKEND_PORT}/ws/transaction
        - VITE_ENABLE_WEBSOCKET=true
        - VITE_XENDIT_SECRET_KEY=xnd_development_ykEXZ7YVjpAqp4yglKZY9VtmKC1Vs9sgwGO2fwjV1IPlaSldRwl3izUtHDCWvsr
        - VITE_DEV=false
        - VITE_PROD=true
    container_name: lofishmart_frontend
    ports:
      - "${FRONTEND_PORT}:80"
    restart: unless-stopped

  backend:
    build:
      context: ./lofishmart-backend
      dockerfile: Dockerfile
    container_name: lofishmart_backend
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - uploads:/app/upload
    environment:
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_SYNC=${DB_SYNC}
      - DB_LOGG=${DB_LOGG}
      - JWT_SECRET=${JWT_SECRET}
      - PROD=${PROD}
      - DEV=${DEV}
      - DEV_ADMIN_URL=${DEV_ADMIN_URL}
      - PROD_ADMIN_URL=${PROD_ADMIN_URL}
      - XENDIT_WEBHOOK_TOKEN=${XENDIT_WEBHOOK_TOKEN}
      - BACKEND_PORT=${BACKEND_PORT}
    command: >
      sh -c "npm run migration && npm run seeder:run && node ./bin/www"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  uploads:
