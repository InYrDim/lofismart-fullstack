      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: ID gudang
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Gudang Utama"
                  description: Nama gudang
                address:
                  type: string
                  example: "Jl. Raya No. 456"
                  description: Alamat gudang
                city:
                  type: string
                  example: "Bandung"
                  description: Kota gudang
                maps:
                  type: string
                  example: "https://maps.google.com/..."
                  description: Link Google Maps
                timezone:
                  type: string
                  example: "Asia/Jakarta"
                  description: Zona waktu gudang
