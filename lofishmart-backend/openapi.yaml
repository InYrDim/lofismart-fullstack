          description: Data tidak ditemukan

  /warehouse/create:
    post:
      tags: [Feature]
      summary: Buat gudang baru
      description: Membuat gudang (warehouse) baru. Type akan diset otomatis sebagai 'GUDANG'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Gudang Pusat"
                  description: Nama gudang
                address:
                  type: string
                  example: "Jl. Raya No. 123"
                  description: Alamat gudang
                city:
                  type: string
                  example: "Jakarta"
                  description: Kota gudang
                maps:
                  type: string
                  example: "https://maps.google.com/..."
                  description: Link Google Maps
                timezone:
                  type: string
                  example: "Asia/Jakarta"
                  description: Zona waktu gudang
                time_dif:
                  type: integer
                  example: 0
                  description: Selisih waktu (dalam jam) relatif terhadap UTC
                phone_number:
                  type: string
                  example: "021-1234567"
                  description: Nomor telepon gudang
      responses:
        "201":
          description: Gudang berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Warehouse created successfully"
                  data:
                    $ref: "#/components/schemas/Profile"
        "400":
          description: Request tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

