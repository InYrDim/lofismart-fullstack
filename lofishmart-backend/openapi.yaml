  # ==================== WEBSOCKET (Informational) ====================  
  /__websocket:
    get:
      tags: [WebSocket]
      summary: Koneksi WebSocket (Informational)
      description: |
        > **Endpoint ini hanya untuk dokumentasi.** Koneksi WebSocket dilakukan secara langsung
        > menggunakan protokol `ws://` atau `wss://`, bukan HTTP GET.

        **Cara Menghubungkan:**
        ```
        ws://localhost:3000?token=YOUR_SESSION_TOKEN
        ```

        **Proses Autentikasi:**
        1. Client mengirim koneksi WebSocket dengan `token` di query parameter.
        2. Server mencari session di database berdasarkan token.
        3. Server memverifikasi JWT payload dari session.
        4. Jika berhasil, server mengirim pesan `connected` dengan `clientId`.
        5. Jika gagal, koneksi ditutup dengan code `4001`.

        **Pesan dari Server:**

        Setelah terkoneksi, client akan menerima pesan JSON berikut:

        **1. `connected`** — Konfirmasi koneksi berhasil
        ```json
        { "type": "connected", "clientId": "user123_1705312200000" }
        ```

        **2. `payment.success`** — Pembayaran QRIS berhasil
        ```json
        {
          "type": "payment.success",
          "data": {
            "reference_id": "abc123xyz",
            "amount": 150000,
            "status": "PAID",
            "qr_id": "qr_xxx_123"
          },
          "timestamp": "2024-01-15T10:30:00.000Z"
        }
        ```

        **3. `payment.expired`** — Pembayaran QRIS kedaluwarsa
        ```json
        {
          "type": "payment.expired",
          "data": {
            "reference_id": "abc123xyz",
            "status": "EXPIRED",
            "qr_id": "qr_xxx_123"
          },
          "timestamp": "2024-01-15T10:30:00.000Z"
        }
        ```
      security: []
      responses:
        "101":
          description: Switching Protocols — WebSocket connection established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSocketMessage"
              examples:
                connected:
                  summary: Koneksi berhasil
                  value:
                    type: connected
                    clientId: "user123_1705312200000"
                paymentSuccess:
                  summary: Pembayaran QRIS berhasil
                  value:
                    type: payment.success
                    data:
                      reference_id: "abc123xyz"
                      amount: 150000
                      status: "PAID"
                      qr_id: "qr_xxx_123"
                    timestamp: "2024-01-15T10:30:00.000Z"
                paymentExpired:
                  summary: Pembayaran QRIS kedaluwarsa
                  value:
                    type: payment.expired
                    data:
                      reference_id: "abc123xyz"
                      status: "EXPIRED"
                      qr_id: "qr_xxx_123"
                    timestamp: "2024-01-15T10:30:00.000Z"

  # ==================== WEBHOOK ====================
  /webhook/xendit:
    post:
      tags: [Webhook]
      summary: Xendit payment webhook
      description: |
        Endpoint untuk menerima notifikasi pembayaran dari Xendit.

        **Alur Pemrosesan:**
        1. Verifikasi `x-callback-token` header.
        2. Proses event berdasarkan tipe:
           - `qr.payment` / `payment.paid` → Update transaksi menjadi `is_paid=3` (paid) dan broadcast `payment.success` via WebSocket.
           - `payment.expired` / `qr.expired` → Broadcast `payment.expired` via WebSocket.
        3. Selalu mengembalikan `200 OK` untuk mencegah retry dari Xendit.

        **Event Types yang Didukung:**

        | Event | Aksi |
        |-------|------|
        | `qr.payment` | Update DB + broadcast `payment.success` |
        | `payment.paid` | Update DB + broadcast `payment.success` |
        | `payment.expired` | Broadcast `payment.expired` |
        | `qr.expired` | Broadcast `payment.expired` |
      security:
        - xenditCallbackToken: []
      parameters:
        - name: x-callback-token
          in: header
          required: true
          schema:
            type: string
          description: Token verifikasi callback dari Xendit (dicocokkan dengan `XENDIT_WEBHOOK_TOKEN`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XenditWebhookPayload"
            examples:
              qrPaymentSuccess:
                summary: Pembayaran QRIS berhasil
                value:
                  event: "qr.payment"
                  data:
                    reference_id: "abc123xyz"
                    amount: 150000
                    status: "SUCCEEDED"
                    qr_id: "qr_xxx_123"
              paymentExpired:
                summary: Pembayaran kedaluwarsa
                value:
                  event: "payment.expired"
                  data:
                    reference_id: "abc123xyz"
                    status: "EXPIRED"
                    qr_id: "qr_xxx_123"
      responses:
        "200":
          description: Webhook diterima dan diproses
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
              examples:
                success:
                  summary: Berhasil diproses
                  value:
                    received: true
                withError:
                  summary: Diterima dengan error (tetap 200)
                  value:
                    received: true
                    error: "Transaction not found"
        "401":
          description: Token callback tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Unauthorized"
        "500":
          description: XENDIT_WEBHOOK_TOKEN belum dikonfigurasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: "Server configuration error"
