openapi: 3.1.0
info:
  title: Lofish Market API
  version: 1.0.0
  description: |
    API untuk sistem Point of Sale (POS) **Lofish Market**.

    Semua endpoint (kecuali `/login` dan `/webhook/*`) memerlukan **Bearer token** authentication.
    Token didapatkan dari endpoint `/login` dan harus disertakan di header:
    ```
    Authorization: Bearer YOUR_TOKEN_HERE
    ```

    Setiap endpoint juga dilindungi oleh sistem **permission** berbasis role.
    Jika user tidak memiliki izin yang sesuai, server akan mengembalikan `403 Forbidden`.
  contact:
    name: API Support
    email: support@lofishmarket.com

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.lofishmarket.com
    description: Production server

# ---------------------------------------------------------------------------
# Tags
# ---------------------------------------------------------------------------
tags:
  - name: Authentication
    description: Login, logout, dan manajemen sesi pengguna.
  - name: Selling
    description: Operasi transaksi penjualan (checkout, daftar, detail).
  - name: Selling Product Detail
    description: Detail produk dalam transaksi penjualan.
  - name: Selling Service Detail
    description: Detail layanan/jasa dalam transaksi penjualan.
  - name: Purchase
    description: Operasi transaksi pembelian/pengadaan barang.
  - name: Product
    description: Manajemen produk, kategori, grade, dan ukuran.
  - name: Service
    description: Manajemen layanan/jasa.
  - name: Stock
    description: Manajemen stok dan stock opname.
  - name: Price
    description: Manajemen harga produk.
  - name: User Management
    description: Manajemen pengguna, role, dan permission.
  - name: Supplier
    description: Manajemen data supplier.
  - name: Member
    description: Manajemen data member/pelanggan.
  - name: Feature
    description: Profil toko, konfigurasi aplikasi, dan kategori aplikasi.
  - name: WebSocket
    description: |
      Koneksi WebSocket untuk menerima notifikasi real-time dari server.

      **URL Koneksi:**
      ```
      ws://localhost:3000?token=SESSION_TOKEN
      ```

      **Autentikasi:**
      Token sesi (dari endpoint `/login`) dikirim sebagai query parameter `token`.
      Server memvalidasi token melalui database session dan verifikasi JWT.

      **Close Codes:**
      | Code | Alasan |
      |------|--------|
      | `4001` | Token tidak diberikan, session tidak valid, atau autentikasi gagal |

      **Format Pesan (Server → Client):**
      Semua pesan dikirim dalam format JSON:
      ```json
      {
        "type": "event_type",
        "data": { ... },
        "timestamp": "2024-01-15T10:30:00.000Z"
      }
      ```

      **Event Types:**

      | Type | Deskripsi | Data Fields |
      |------|-----------|-------------|
      | `connected` | Koneksi berhasil | `clientId` |
      | `payment.success` | Pembayaran QRIS berhasil (dari Xendit webhook) | `reference_id`, `amount`, `status`, `qr_id` |
      | `payment.expired` | Pembayaran QRIS kedaluwarsa | `reference_id`, `status`, `qr_id` |

      **Filter:**
      Pesan broadcast dapat difilter berdasarkan `marketId` dan `userId` dari JWT payload klien.
  - name: Webhook
    description: |
      Endpoint webhook untuk menerima callback dari layanan pihak ketiga (Xendit).

      **Keamanan:**
      Webhook tidak menggunakan Bearer token. Verifikasi dilakukan melalui header `x-callback-token`
      yang dicocokkan dengan environment variable `XENDIT_WEBHOOK_TOKEN`.

      **Alur:**
      1. Xendit mengirim HTTP POST ke `/webhook/xendit` saat terjadi event pembayaran.
      2. Server memverifikasi `x-callback-token` header.
      3. Server memproses event (update database, broadcast via WebSocket).
      4. Server selalu mengembalikan `200 OK` untuk mencegah retry dari Xendit.

x-tagGroups:
  - name: 🔐 Authentication
    tags:
      - Authentication
  - name: 💰 Transaksi
    tags:
      - Selling
      - Selling Product Detail
      - Selling Service Detail
      - Purchase
  - name: 📦 Produk & Inventori
    tags:
      - Product
      - Service
      - Stock
      - Price
  - name: 👤 Pengguna
    tags:
      - User Management
      - Supplier
      - Member
  - name: ⚙️ Fitur
    tags:
      - Feature
  - name: 🔌 Web Services
    tags:
      - WebSocket
      - Webhook

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - bearerAuth: []

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session token dari endpoint `/login`.

    xenditCallbackToken:
      type: apiKey
      in: header
      name: x-callback-token
      description: Token verifikasi callback dari Xendit.

  schemas:
    # --- Common ---
    Error:
      type: object
      properties:
        message:
          type: string
          example: "Error message"
        login:
          type: boolean
          example: false

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 8

    # --- User Domain ---
    User:
      type: object
      properties:
        id:
          type: string
          example: "user123"
        username:
          type: string
          example: "kasir01"
        email:
          type: string
          example: "kasir01@example.com"

    Market:
      type: object
      properties:
        id:
          type: string
          example: "market01"
        name:
          type: string
          example: "Toko Pusat"

    # --- Product Domain ---
    Stock:
      type: object
      properties:
        id:
          type: string
          example: "stock001"
        name:
          type: string
          example: "Produk A"
        qty:
          type: number
          example: 100

    Price:
      type: object
      properties:
        id:
          type: string
          example: "price001"
        price:
          type: number
          example: 25000

    PaymentMethod:
      type: object
      properties:
        id:
          type: string
          example: "pm01"
        name:
          type: string
          example: "QRIS"

    # --- Transaction Domain ---
    TransactionItem:
      type: object
      properties:
        id:
          type: string
          example: "detail001"
        qty:
          type: number
          example: 2
        mod_price:
          type: number
          example: 25000
        total_price:
          type: number
          example: 50000
        note:
          type: string
          nullable: true
        stock:
          $ref: "#/components/schemas/Stock"
        price:
          $ref: "#/components/schemas/Price"

    SellingProductDetail:
      type: object
      properties:
        id:
          type: string
          example: "spd001"
        qty:
          type: integer
          example: 2
        mod_price:
          type: number
          example: 25000
          description: Harga modifikasi (misal jika grade 3-4)
        total_price:
          type: number
          example: 50000
          description: "price × weight/pcs"
        note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        selling:
          $ref: "#/components/schemas/Transaction"
        stock:
          $ref: "#/components/schemas/Stock"
        price:
          $ref: "#/components/schemas/Price"

    SellingServiceDetail:
      type: object
      properties:
        id:
          type: string
          example: "ssd001"
        qty:
          type: integer
          example: 1
        mod_price:
          type: number
          example: 15000
        total_price:
          type: number
          example: 15000
          description: "price × weight/pcs"
        note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        selling:
          $ref: "#/components/schemas/Transaction"
        service:
          type: object
          description: Referensi ke entity Service

    Transaction:
      type: object
      properties:
        id:
          type: string
          example: "abc123xyz"
        payment_id:
          type: string
          nullable: true
          example: "xendit_payment_123"
        total_price:
          type: number
          example: 150000
        payed_money:
          type: number
          example: 200000
        change_money:
          type: number
          example: 50000
        total_weight_qty:
          type: number
          example: 1.5
        totol_pcs_qty:
          type: number
          example: 10
        price:
          type: number
          example: 200000
          description: Total harga sebelum diskon/pajak
        per_item_disc:
          type: number
          example: 0
        voucher_disc:
          type: number
          example: 0
        total_disc:
          type: number
          example: 0
        tax_price:
          type: number
          example: 0
        online_order:
          type: string
          enum: ["1", "2", "3"]
          example: "1"
          description: "1=offline, 2=offline, 3=other"
        note:
          type: string
          nullable: true
          example: "Catatan transaksi"
        member:
          $ref: "#/components/schemas/Member"
        voucher:
          $ref: "#/components/schemas/Voucher"
        is_paid:
          type: string
          enum: ["1", "2", "3", "4"]
          example: "3"
          description: "1=overview, 2=unpaid, 3=paid"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
        user:
          $ref: "#/components/schemas/User"
        market:
          $ref: "#/components/schemas/Market"
        payment:
          $ref: "#/components/schemas/PaymentMethod"
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransactionItem"

    # --- WebSocket ---
    WebSocketMessage:
      type: object
      description: Format pesan yang dikirim server ke client melalui WebSocket.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - connected
            - payment.success
            - payment.expired
          description: Tipe event.
        data:
          type: object
          description: Payload data (berbeda per tipe event).
        timestamp:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"

    WebSocketConnectedData:
      type: object
      properties:
        clientId:
          type: string
          example: "user123_1705312200000"
          description: ID unik client yang terdiri dari userId dan timestamp.

    WebSocketPaymentSuccessData:
      type: object
      properties:
        reference_id:
          type: string
          example: "abc123xyz"
          description: ID transaksi yang dibayar.
        amount:
          type: number
          example: 150000
          description: Jumlah pembayaran.
        status:
          type: string
          example: "PAID"
        qr_id:
          type: string
          example: "qr_xxx_123"

    WebSocketPaymentExpiredData:
      type: object
      properties:
        reference_id:
          type: string
          example: "abc123xyz"
          description: ID transaksi yang kedaluwarsa.
        status:
          type: string
          example: "EXPIRED"
        qr_id:
          type: string
          example: "qr_xxx_123"

    # --- Webhook ---
    XenditWebhookPayload:
      type: object
      description: Payload callback dari Xendit.
      required:
        - event
        - data
      properties:
        event:
          type: string
          enum:
            - qr.payment
            - payment.paid
            - payment.expired
            - qr.expired
          description: Tipe event dari Xendit.
          example: "qr.payment"
        data:
          type: object
          properties:
            reference_id:
              type: string
              example: "abc123xyz"
              description: ID referensi transaksi.
            external_id:
              type: string
              example: "ext_abc123"
              description: ID external (alternatif dari reference_id).
            amount:
              type: number
              example: 150000
              description: Jumlah pembayaran.
            status:
              type: string
              enum:
                - SUCCEEDED
                - PAID
                - EXPIRED
              example: "SUCCEEDED"
            qr_id:
              type: string
              example: "qr_xxx_123"
              description: ID QR code dari Xendit.

  responses:
    Unauthorized:
      description: Token tidak valid atau tidak diberikan.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Token invalid atau expired"
            login: false

    Forbidden:
      description: User tidak memiliki izin untuk operasi ini.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: "Do not have permission for this operation."
            login: true

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  # ==================== AUTHENTICATION ====================
  /login:
    post:
      tags: [Authentication]
      summary: Login pengguna
      description: Autentikasi pengguna dan mendapatkan session token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: "kasir01"
                password:
                  type: string
                  example: "password123"
      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    description: Session token untuk autentikasi API dan WebSocket.
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /logout:
    post:
      tags: [Authentication]
      summary: Logout pengguna
      description: Menghapus session aktif pengguna.
      responses:
        "200":
          description: Logout berhasil
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ==================== SELLING TRANSACTIONS ====================
  /transaction/selling/list:
    get:
      tags: [Selling]
      summary: Daftar transaksi penjualan
      description: Mendapatkan daftar transaksi penjualan dengan paginasi dan filter.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: start_date
          in: query
          schema:
            type: string
            format: date
          description: Filter dari tanggal (YYYY-MM-DD)
        - name: end_date
          in: query
          schema:
            type: string
            format: date
          description: Filter sampai tanggal (YYYY-MM-DD)
        - name: is_paid
          in: query
          schema:
            type: string
            enum: ["1", "2", "3"]
          description: "Status pembayaran: 1=overview, 2=unpaid, 3=paid"
        - name: user_id
          in: query
          schema:
            type: string
          description: Filter berdasarkan kasir
        - name: market_id
          in: query
          schema:
            type: string
          description: Filter berdasarkan toko
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /transaction/selling/create:
    post:
      tags: [Selling]
      summary: Buat transaksi penjualan baru
      description: |
        Membuat transaksi penjualan baru (checkout).
        Jika metode pembayaran QRIS, transaksi akan dibuat dengan status `is_paid=2`
        dan akan diupdate otomatis melalui webhook Xendit setelah pembayaran berhasil.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - total_price
                - payed_money
                - change_money
                - is_paid
                - payment_method_id
                - market_id
                - user_id
                - items
              properties:
                total_price:
                  type: number
                  example: 150000
                payed_money:
                  type: number
                  example: 200000
                change_money:
                  type: number
                  example: 50000
                is_paid:
                  type: string
                  enum: ["1", "2", "3", "4"]
                  example: "3"
                payment_method_id:
                  type: string
                  example: "pm01"
                market_id:
                  type: string
                  example: "market01"
                user_id:
                  type: string
                  example: "user123"
                payment_id:
                  type: string
                  example: "xendit_123"
                total_weight_qty:
                  type: number
                  example: 1.5
                totol_pcs_qty:
                  type: number
                  example: 5
                price:
                  type: number
                  example: 150000
                per_item_disc:
                  type: number
                  example: 0
                voucher_disc:
                  type: number
                  example: 0
                total_disc:
                  type: number
                  example: 0
                tax_price:
                  type: number
                  example: 0
                online_order:
                  type: string
                  enum: ["1", "2", "3"]
                  example: "1"
                note:
                  type: string
                  example: "Catatan khusus"
                member_id:
                  type: string
                  example: "member001"
                voucher_id:
                  type: string
                  example: "vc001"
                items:
                  type: string
                  description: JSON string array of items
                  example: '[{"stock_id":"stock001","qty":2,"price":25000,"total_price":50000}]'
      responses:
        "201":
          description: Transaksi berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Transaction created successfully"
                  data:
                    $ref: "#/components/schemas/Transaction"
        "400":
          description: Request tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /transaction/selling/update/{id}:
    patch:
      tags: [Selling]
      summary: Update transaksi penjualan
      description: Mengupdate data transaksi penjualan yang ada.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaksi berhasil diupdate
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Transaksi tidak ditemukan

  /transaction/selling/delete/{id}:
    delete:
      tags: [Selling]
      summary: Hapus transaksi penjualan
      description: Menghapus transaksi penjualan secara permanen.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaksi berhasil dihapus
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ==================== SELLING PRODUCT DETAIL ====================
  /transaction/selling/product/detail/list:
    get:
      tags: [Selling Product Detail]
      summary: Daftar detail produk penjualan
      description: Mendapatkan semua detail produk dari transaksi penjualan, dengan filter opsional.
      parameters:
        - name: selling_id
          in: query
          schema:
            type: string
          description: Filter berdasarkan ID transaksi penjualan
        - name: market_id
          in: query
          schema:
            type: string
          description: Filter berdasarkan toko (via relasi selling)
        - name: user_id
          in: query
          schema:
            type: string
          description: Filter berdasarkan kasir (via relasi selling)
        - name: stock_id
          in: query
          schema:
            type: string
          description: Filter berdasarkan stok produk
        - name: price_id
          in: query
          schema:
            type: string
          description: Filter berdasarkan harga produk
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellingProductDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /transaction/selling/product/detail/create:
    post:
      tags: [Selling Product Detail]
      summary: Tambah detail produk penjualan
      description: Menambahkan detail produk ke transaksi penjualan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selling_id:
                  type: string
                  example: "abc123xyz"
                stock_id:
                  type: string
                  example: "stock001"
                price_id:
                  type: string
                  example: "price001"
                qty:
                  type: integer
                  example: 2
                mod_price:
                  type: number
                  example: 25000
                total_price:
                  type: number
                  example: 50000
                note:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellingProductDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /transaction/selling/product/detail/update/{id}:
    patch:
      tags: [Selling Product Detail]
      summary: Update detail produk penjualan
      description: Mengupdate detail produk dalam transaksi penjualan.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                qty:
                  type: integer
                mod_price:
                  type: number
                total_price:
                  type: number
                note:
                  type: string
      responses:
        "200":
          description: Berhasil diupdate
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Detail tidak ditemukan

  /transaction/selling/product/detail/delete/{id}:
    delete:
      tags: [Selling Product Detail]
      summary: Hapus detail produk penjualan
      description: Menghapus detail produk dari transaksi penjualan.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Berhasil dihapus
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ==================== SELLING SERVICE DETAIL ====================
  /transaction/selling/service/detail/list:
    get:
      tags: [Selling Service Detail]
      summary: Daftar detail layanan penjualan
      description: Mendapatkan semua detail layanan/jasa dari transaksi penjualan.
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellingServiceDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /transaction/selling/service/detail/create:
    post:
      tags: [Selling Service Detail]
      summary: Tambah detail layanan penjualan
      description: Menambahkan detail layanan/jasa ke transaksi penjualan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selling_id:
                  type: string
                  example: "abc123xyz"
                service_id:
                  type: string
                  example: "svc001"
                qty:
                  type: integer
                  example: 1
                mod_price:
                  type: number
                  example: 15000
                total_price:
                  type: number
                  example: 15000
                note:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Berhasil ditambahkan
          content:
            application/json:
              schema:
